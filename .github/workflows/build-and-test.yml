name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-unix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v3

      - name: Install LLVM and Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20 all
          echo "LLVM_PATH=$(llvm-config-20 --prefix)" >> $GITHUB_ENV

      - name: Install LLVM and Clang (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@20
          echo "LLVM_PATH=$(brew --prefix llvm@20)" >> $GITHUB_ENV

      - name: Setup PATH
        run: echo "$LLVM_PATH/bin" >> $GITHUB_PATH

      - name: Verify Clang Path
        run: |
          which clang
          clang --version

      - name: Build hoshi-lang with std integration
        env:
          CC: clang
          CXX: clang++
          LLVM_DIR: ${{ env.LLVM_PATH }}/lib/cmake/llvm
        shell: bash
        run: 
          make compiler-dependency cmake_production build_production

      - name: Package
        env:
          CC: clang
          CXX: clang++
          LLVM_DIR: ${{ env.LLVM_PATH }}/lib/cmake/llvm
        shell: bash
        run: 
          make package

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hoshi-lang-${{ matrix.os == 'ubuntu-latest' && 'linux' || 'darwin' }}
          path: |
            build-package/*

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        toolchain: [ 'mingw', 'clang' ]
    steps:
      - uses: actions/checkout@v3

      - name: Download and Setup OpenSSL (Manual)
        run: |
          # Download OpenSSL Installer (Win64 v3.3.2)
          Invoke-WebRequest -Uri "https://slproweb.com/download/Win64OpenSSL-3_0_18.exe" -OutFile "openssl-setup.exe"
          
          # Define install path within the workspace
          $opensslPath = "C:\OpenSSL"
          
          # Install silently to the specific directory
          Start-Process -FilePath ".\openssl-setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/DIR=$opensslPath" -Wait
          
          # Export Environment Variables for CMake and PATH
          echo "OPENSSL_ROOT_DIR=$opensslPath" >> $env:GITHUB_ENV
          echo "OPENSSL_CONF=$opensslPath\bin\openssl.cfg" >> $env:GITHUB_ENV
          echo "$opensslPath\bin" >> $env:GITHUB_PATH
          Copy-Item -Path "$opensslPath\lib\VC\x64\MT\*.lib" -Destination "$opensslPath\lib" -Recurse
          dir $opensslPath
          dir $opensslPath\bin
          dir $opensslPath\lib
          dir $opensslPath\include


      - name: Install LLVM and Clang (Windows)
        run: |
          curl -L -o llvm.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/clang+llvm-20.1.8-x86_64-pc-windows-msvc.tar.xz
          tar -xf llvm.tar.xz
        shell: bash

      - name: Setup PATH Step 1
        run: |
          echo "LLVM_PATH=$PWD/clang+llvm-20.1.8-x86_64-pc-windows-msvc" >> $env:GITHUB_ENV
      
      - name: Setup PATH Step 2
        run: |
          echo "$PWD/clang+llvm-20.1.8-x86_64-pc-windows-msvc/bin" >> $env:GITHUB_PATH

      - name: Verify Clang Path
        run: |
          where clang
          clang --version

      - name: Build hoshi-lang with std integration
        env:
          CC: clang
          CXX: clang++
          LLVM_DIR: ${{ env.LLVM_PATH }}/lib/cmake/llvm
        shell: bash
        run: 
          make compiler-dependency cmake_production build_production

      - name: Build elysia_runtime with mingw
        if: matrix.toolchain == 'mingw'
        run: |
          if ("${{ matrix.toolchain }}" -eq "mingw") {
            echo "CC=gcc" >> $env:GITHUB_ENV
            echo "CXX=g++" >> $env:GITHUB_ENV
          } else {
            echo "CC=clang" >> $env:GITHUB_ENV
            echo "CXX=clang++" >> $env:GITHUB_ENV
          }
          cd hoshi-lang
          mv cmake-build-release cmake-build-release-clang
          make cmake_production
          cd cmake-build-release && make elysia_runtime -j16 && cd ..
          mv cmake-build-release-clang\*hoshi_lang* cmake-build-release\
          cd ..

      - name: Package
        run: make package
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hoshi-lang-windows-${{ matrix.toolchain }}
          path: |
            build-package/*