name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Added manual trigger for release creation
  workflow_dispatch:
    inputs:
      release_draft:
        description: 'Create a release draft?'
        required: true
        type: boolean
        default: false
      version_title:
        description: 'Version Title (e.g. v0.1.0)'
        required: false
        type: string
        default: 'v0.0.0-nightly'

permissions:
  contents: write

jobs:
  build-unix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v3

      - name: Install LLVM and Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt install libssl-dev -y
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21 all
          echo "LLVM_PATH=$(llvm-config-21 --prefix)" >> $GITHUB_ENV

      - name: Further setup for Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt install libzstd-dev zlib1g-dev zlib1g llvm-21-dev llvm-21-linker-tools libpolly-21-dev -y

      - name: Install LLVM and Clang (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21 zstd zlib
          echo "LLVM_PATH=$(brew --prefix llvm@21)" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$LIBRARY_PATH:$(brew --prefix)/lib" >> $GITHUB_ENV

      - name: Setup PATH
        run: echo "$LLVM_PATH/bin" >> $GITHUB_PATH

      - name: Verify Clang Path
        run: |
          which clang
          clang --version

      - name: Build hoshi-lang with std integration
        env:
          CC: clang
          CXX: clang++
          LLVM_DIR: ${{ env.LLVM_PATH }}/lib/cmake/llvm
        shell: bash
        run: 
          make compiler-dependency cmake_production build_production

      - name: Package
        env:
          CC: clang
          CXX: clang++
          LLVM_DIR: ${{ env.LLVM_PATH }}/lib/cmake/llvm
        shell: bash
        run: 
          make package

      - name: Build tsuki package manager
        env:
          CC: clang
          CXX: clang++
          LLVM_DIR: ${{ env.LLVM_PATH }}/lib/cmake/llvm
        shell: bash
        run: |
          ./build-package/bin/hoshi_lang ./src/tsuki/main.hoshi -o build-package/bin/tsuki -I src --build-mode release
          ./build-package/bin/hoshi_lang ./src/tsuki/update.hoshi -o build-package/bin/tsuki-update -I src --build-mode release

      - name: Upload hoshi-lang artifacts
        uses: actions/upload-artifact@v4
        with:
          # Naming artifacts distinctly to ensure easier collection later
          name: hoshi-lang-${{ matrix.os == 'ubuntu-latest' && 'linux' || 'darwin' }}
          path: |
            build-package/*

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          # Naming artifacts distinctly to ensure easier collection later
          name: hoshi-lang-installer-${{ matrix.os == 'ubuntu-latest' && 'linux' || 'darwin' }}
          path: |
            build-package/bin/tsuki
            build-package/bin/tsuki-update

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        toolchain: [ 'mingw', 'clang' ]
    steps:
      - uses: actions/checkout@v3
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Download and Setup OpenSSL (Manual)
        run: |
          # Download OpenSSL Installer (Win64 v3.3.2)
          Invoke-WebRequest -Uri "https://slproweb.com/download/Win64OpenSSL-3_0_19.exe" -OutFile "openssl-setup.exe"
          
          # Define install path within the workspace
          $opensslPath = "C:\OpenSSL"
          
          # Install silently to the specific directory
          Start-Process -FilePath ".\openssl-setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/DIR=$opensslPath" -Wait
          
          # Export Environment Variables for CMake and PATH
          echo "OPENSSL_ROOT_DIR=$opensslPath" >> $env:GITHUB_ENV
          echo "OPENSSL_CONF=$opensslPath\bin\openssl.cfg" >> $env:GITHUB_ENV
          echo "$opensslPath\bin" >> $env:GITHUB_PATH
          Copy-Item -Path "$opensslPath\lib\VC\x64\MD\*.lib" -Destination "$opensslPath\lib" -Recurse
          dir $opensslPath
          dir $opensslPath\bin
          dir $opensslPath\lib
          dir $opensslPath\include

      - name: Install LLVM and Clang (Windows)
        run: |
          curl -L -o llvm.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/clang+llvm-21.1.8-x86_64-pc-windows-msvc.tar.xz
          tar -xf llvm.tar.xz
        shell: bash

      - name: Setup PATH Step 1
        run: |
          echo "LLVM_PATH=$PWD/clang+llvm-21.1.8-x86_64-pc-windows-msvc" >> $env:GITHUB_ENV
      
      - name: Setup PATH Step 2
        run: |
          echo "$PWD/clang+llvm-21.1.8-x86_64-pc-windows-msvc/bin" >> $env:GITHUB_PATH

      - name: Verify Clang Path
        run: |
          where clang
          clang --version

      - name: Build hoshi-lang with std integration
        env:
          CC: clang
          CXX: clang++
          LLVM_DIR: ${{ env.LLVM_PATH }}/lib/cmake/llvm
        shell: bash
        run: 
          make compiler-dependency cmake_production build_production

      - name: Build elysia_runtime with mingw
        if: matrix.toolchain == 'mingw'
        run: |
          if ("${{ matrix.toolchain }}" -eq "mingw") {
            echo "CC=gcc" >> $env:GITHUB_ENV
            echo "CXX=g++" >> $env:GITHUB_ENV
          } else {
            echo "CC=clang" >> $env:GITHUB_ENV
            echo "CXX=clang++" >> $env:GITHUB_ENV
          }
          cd hoshi-lang
          mv cmake-build-release cmake-build-release-clang
          make cmake_production
          cd cmake-build-release && make elysia_runtime -j16 && cd ..
          mv cmake-build-release-clang\*hoshi_lang* cmake-build-release\
          cd ..

      - name: Package
        run: make package
        shell: bash

      - name: Build tsuki package manager
        if: matrix.toolchain == 'clang'
        env:
          CC: clang
          CXX: clang++
          LLVM_DIR: ${{ env.LLVM_PATH }}/lib/cmake/llvm
        shell: bash
        run: |
          ./build-package/bin/hoshi_lang.exe ./src/tsuki/main.hoshi -o build-package/bin/tsuki.exe -I src --build-mode release
          ./build-package/bin/hoshi_lang.exe ./src/tsuki/update.hoshi -o build-package/bin/tsuki-update.exe -I src --build-mode release

      - name: Upload hoshi-lang artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hoshi-lang-windows-${{ matrix.toolchain }}
          path: |
            build-package/*

      - name: Upload installer artifacts
        if: matrix.toolchain == 'clang'
        uses: actions/upload-artifact@v4
        with:
          name: hoshi-lang-installer-windows
          path: |
            build-package/bin/tsuki.exe
            build-package/bin/tsuki-update.exe

  # New job to handle release creation
  create-release:
    needs: [build-unix, build-windows]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_draft == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Required to generate changelog correctly

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          # v4 extracts artifacts into folders named after the artifact
          path: artifacts

      - name: Archive artifacts
        run: |
          mkdir release_assets
          cd artifacts
          # Iterate over the directories created by download-artifact
          for dir in */ ; do
            # Remove trailing slash from directory name
            dirname=${dir%/}
            echo "Zipping $dirname..."
            # Create a zip file containing the directory
            zip -r "../release_assets/${dirname}.zip" "$dirname"
          done
          echo "Created the following release assets:"
          ls -l ../release_assets

      - name: Create Release Draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version_title }}
          name: Release ${{ inputs.version_title }}
          draft: true
          # This creates the changelog automatically based on PRs/Commits
          generate_release_notes: true 
          files: release_assets/*.zip